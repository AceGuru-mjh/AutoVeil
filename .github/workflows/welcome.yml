# 欢迎 Bot —— 首次提交 Issue / PR 时自动发送欢迎评论
# 使用 actions/first-interaction，仅对每位用户首次交互触发一次
name: Welcome

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: welcome-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 感谢提交 Issue！请补充以下信息以便定位问题：
            - 设备型号 / Android 版本
            - Root 来源（Magisk / KernelSU / APatch）及版本
            - FS 拦截器类型（overlayfs / bind / noop）
            - 日志：`adb shell cat /data/adb/nexuscore/nexusd.log`

            若为功能讨论，也欢迎移步 Discussions。
          pr-message: |
            🎉 感谢提交 PR！请确认：
            - [ ] 完成 [PR 模板](../blob/main/.github/PULL_REQUEST_TEMPLATE.md) 中的"严肃约束自检"
            - [ ] 本地构建通过（Manager `./gradlew :app:assembleDebug`；Daemon `./build.sh arm64-v8a`）
            - [ ] commit 遵循 Conventional Commits 规范

            等待 CI 通过后会进行 Review。
