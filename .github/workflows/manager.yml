# NexusCore Manager - Android APK 编译 CI
#
# 在 GitHub Actions 上编译 NexusManager APK，验证 Kotlin/Compose 代码可正常构建。
# 产物作为 artifact 上传，方便下载测试。

name: Build Manager APK

on:
  push:
    branches: [main, fix/comprehensive-overhaul, 'feat/**']
    paths:
      - 'nexuscore/manager/**'
      - '.github/workflows/manager.yml'
  pull_request:
    paths:
      - 'nexuscore/manager/**'
      - '.github/workflows/manager.yml'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: wrapper
          build-root-directory: nexuscore/manager

      - name: Grant execute permission for gradlew
        run: chmod +x nexuscore/manager/gradlew

      - name: Build debug APK
        working-directory: nexuscore/manager
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK (with debug signing fallback)
        working-directory: nexuscore/manager
        run: ./gradlew :app:assembleRelease --no-daemon -x lintVitalRelease || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-manager-debug-apk
          path: nexuscore/manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-manager-release-apk
          path: nexuscore/manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
