# Release 构建 - 当推送 tag v* 时自动构建 APK 并创建 GitHub Release

name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: wrapper
          build-root-directory: nexuscore/manager

      - name: Grant execute permission for gradlew
        run: chmod +x nexuscore/manager/gradlew

      - name: Build debug APK
        working-directory: nexuscore/manager
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        working-directory: nexuscore/manager
        run: ./gradlew :app:assembleRelease --no-daemon -x lintVitalRelease || true

      - name: Sign debug APK as release (fallback)
        if: failure()
        working-directory: nexuscore/manager
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk 2>/dev/null || true

      - name: Rename APK with version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          mkdir -p release-assets
          cp nexuscore/manager/app/build/outputs/apk/debug/*.apk release-assets/NexusManager-$TAG-debug.apk 2>/dev/null || true
          cp nexuscore/manager/app/build/outputs/apk/release/*.apk release-assets/NexusManager-$TAG-release.apk 2>/dev/null || true
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NexusCore ${{ env.RELEASE_TAG }}
          body: |
            # NexusCore ${{ env.RELEASE_TAG }}

            ## 下载

            - **NexusManager-${{ env.RELEASE_TAG }}-debug.apk** — Debug 版 APK（debug 签名）
            - **NexusManager-${{ env.RELEASE_TAG }}-release.apk** — Release 版 APK（如有配置签名）

            ## 安装

            1. 下载 debug APK
            2. `adb install NexusManager-${{ env.RELEASE_TAG }}-debug.apk`
            3. 打开 NexusManager，进入 Settings > 修补 boot.img

            ## 状态

            本版本为 MVP 阶段，核心功能包括：
            - Boot Image Patcher（自研，不抄 Magisk）
            - SU 授权系统（自研 su daemon + am start 弹窗）
            - 模块系统（DMM manifest.json + capabilities 校验）
            - Magisk 兼容层（自动转换 module.prop）
            - NexusHook（Rust + ptrace + ART hook 生成）
            - SELinux 策略工具（nexuspolicy）
            - Compose Material 3 毛玻璃 UI

            ⚠️ 不建议在生产设备使用。需要 Android 14+ arm64 设备。
          draft: false
          prerelease: true
          files: |
            release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
