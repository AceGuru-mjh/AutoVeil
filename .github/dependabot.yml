# Dependabot —— 依赖与 GitHub Actions 版本自动更新
# 文档：https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Gradle 依赖（NexusManager）
  - package-ecosystem: gradle
    directory: "/nexuscore/manager"
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - manager
    commit-message:
      prefix: "chore(manager)"
    groups:
      kotlin-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "androidx.compose*"
          - "androidx.core*"
      gradle-plugins:
        patterns:
          - "com.android*"
          - "org.jetbrains.kotlin.plugin*"

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
