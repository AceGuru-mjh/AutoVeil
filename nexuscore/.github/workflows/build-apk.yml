name: Build NexusCore Manager APK

on:
  push:
    branches: [ main, 'trae/**' ]
    paths:
      - 'manager/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'manager/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Grant execute permission for gradlew
        working-directory: manager
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: manager
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK (no signing)
        working-directory: manager
        run: ./gradlew :app:assembleRelease --no-daemon -x lintVitalRelease || true

      - name: Locate APKs
        id: locate
        working-directory: manager
        run: |
          set -e
          DEBUG_APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1 || true)
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*release*.apk' | head -1 || true)
          echo "debug_apk=$DEBUG_APK" >> "$GITHUB_OUTPUT"
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "=== Debug APK: $DEBUG_APK ==="
          echo "=== Release APK: $RELEASE_APK ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || true
          ls -la app/build/outputs/apk/release/ 2>/dev/null || true

      - name: Upload debug APK artifact
        if: steps.locate.outputs.debug_apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: nexuscore-manager-debug-apk
          path: manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK artifact
        if: steps.locate.outputs.release_apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: nexuscore-manager-release-apk
          path: manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            manager/app/build/reports/
            manager/build/reports/
          if-no-files-found: ignore
          retention-days: 7
